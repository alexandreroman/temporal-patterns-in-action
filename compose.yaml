# Settings shared by every pattern worker; each worker service merges them
# with `<<: *worker` and adds its own `build`.
x-worker: &worker
  environment:
    TEMPORAL_ADDRESS: temporal:7233
    NATS_URL: nats://nats:4222
    HEALTH_PORT: 8080
  depends_on:
    temporal:
      condition: service_healthy
    nats:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/usr/local/bin/worker", "-healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s
  deploy:
    resources:
      limits:
        memory: 64M
  restart: on-failure

services:
  temporal:
    image: temporalio/temporal:1.9.1
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --dynamic-config-value
      - matching.useNewMatcher=true
      - --dynamic-config-value
      - matching.enableFairness=true
      - --dynamic-config-value
      - matching.enableMigration=true
    ports:
      - "7233:7233" # gRPC — workers & clients
      - "8233:8233" # Web UI — http://localhost:8233
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  nats:
    image: nats:2.15-alpine
    command: ["-m", "8222"] # monitoring port, probed by the healthcheck
    ports:
      - "4222:4222" # client protocol — workers & frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      NATS_URL: nats://nats:4222
    ports:
      - "3000:3000"
    depends_on:
      temporal:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: on-failure

  worker-saga:
    <<: *worker
    build:
      context: ./workers
      dockerfile: saga/Dockerfile

  worker-batch:
    <<: *worker
    build:
      context: ./workers
      dockerfile: batch/Dockerfile
    # The merge key is shallow, so `deploy` is restated in full to add replicas.
    deploy:
      replicas: ${BATCH_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: 64M

  worker-agent:
    <<: *worker
    build:
      context: ./workers
      dockerfile: agent/Dockerfile

  codec-server:
    build:
      context: .
      dockerfile: codec-server/Dockerfile
    environment:
      LISTEN_ADDR: ":8888"
      # Origins allowed to call /decode from the browser. The Temporal Web
      # UI runs on 8233; add others (comma-separated) if needed.
      UI_ORIGIN: "http://localhost:8233,http://127.0.0.1:8233"
    ports:
      - "8888:8888" # http — Temporal Web UI "Remote Codec Endpoint"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: on-failure

  worker-encryption:
    <<: *worker
    build:
      context: ./workers
      dockerfile: encryption/Dockerfile

  worker-multi-agent:
    <<: *worker
    build:
      context: ./workers
      dockerfile: multi-agent/Dockerfile

  worker-entity:
    <<: *worker
    build:
      context: ./workers
      dockerfile: entity/Dockerfile

  worker-priority-fairness:
    <<: *worker
    build:
      context: ./workers
      dockerfile: priority-fairness/Dockerfile
